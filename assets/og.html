<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>GulfPay social card</title>
<style>
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;background:#fcfcfb;color:#0b0b0b;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;justify-content:center;
       padding:0 86px;box-sizing:border-box;position:relative}
  .brand{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:700;letter-spacing:-.02em;margin-bottom:38px}
  .dot{width:26px;height:26px;border-radius:7px;background:#2a78d6}
  h1{font-size:74px;line-height:1.05;letter-spacing:-.035em;margin:0 0 26px;font-weight:700;max-width:16ch}
  p{font-size:28px;line-height:1.45;color:#52514e;margin:0;max-width:30ch}
  .bar{position:absolute;left:0;right:0;bottom:0;height:12px;background:#2a78d6}
  .countries{position:absolute;bottom:52px;left:86px;display:flex;gap:14px;font-size:21px;color:#898781;letter-spacing:.03em}
  .ar{position:absolute;top:84px;right:86px;font-size:30px;color:#898781;direction:rtl;text-align:right}
</style></head>
<body>
  <div class="brand"><span class="dot"></span>GulfPay</div>
  <div class="ar">أضف راتبك</div>
  <h1>What tech people actually earn in the Gulf.</h1>
  <p>Anonymous, crowdsourced salary data. Free.</p>
  <div class="countries"><span>UAE</span><span>·</span><span>SAUDI</span><span>·</span><span>QATAR</span><span>·</span><span>KUWAIT</span><span>·</span><span>BAHRAIN</span><span>·</span><span>OMAN</span></div>
  <div class="bar"></div>
</body></html>
